# batch-reader-hostpath with nothing to say: the same job reading the same
# dataset from a hostPath on the target disk, but it writes nothing to stdout
# or stderr, and a failed read neither prints nor exits, so its only
# terminations are the ones done to it. For the silent-137 scenarios, where
# hack/symptoms/silent-kill.sh (APP=batch-reader) kills it with exit 137 and
# nothing in its logs may say why.
apiVersion: v1
kind: Namespace
metadata: {name: tropis-eval}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-reader
  namespace: tropis-eval
  labels: {tropis.io/eval: "true"}
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: {app: batch-reader, tropis.io/eval: "true"}
    spec:
      nodeSelector: {kubernetes.io/hostname: "${TROPIS_NODE}"}
      restartPolicy: OnFailure
      containers:
        - name: reader
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              exec >/dev/null 2>&1
              [ -f /data/dataset ] || dd if=/dev/urandom of=/data/dataset bs=1M count=256 conv=fsync
              while true; do
                md5sum /data/dataset || true
                sleep 5
              done
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          hostPath: {path: "${TROPIS_MOUNT}/batch", type: DirectoryOrCreate}
